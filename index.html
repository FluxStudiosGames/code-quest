<style>
  :root { --ui: 16px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1b1d3a; overflow: hidden; overscroll-behavior: none;
    font-family: "Segoe UI", "Trebuchet MS", system-ui, sans-serif; color: #24264a;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;

  body { position: fixed; inset: 0; }
  #wrap { position: absolute; left: 0; top: 0; }
  #safe { position: fixed; left: 0; top: 0; visibility: hidden; pointer-events: none;

  canvas { touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; border-radius: 6px; }
  code, pre { font-family: "Fira Code", Consolas, "Courier New", monospace; }
  code { background: #24264a; color: #9ef0a6; padding: .05em .35em; border-radius: .3em; font-size: .92em; white-space: nowrap; }
  pre { margin: 0; background: #24264a; color: #e8e9ff; padding: .6em .8em; border-radius: .5em; text-align: left; font-size: .95em; line-height: 1.35; }
  .kw { color: #ff9ecd; } .str { color: #ffd479; } .num { color: #9fd8ff; } .fn { color: #9ef0a6; }

  /* HUD */
  #hud { position: absolute; left: 0; top: 0; right: 0; display: flex; gap: .6em; align-items: center;
    padding: .5em .7em; font-size: 1.05em; pointer-events: none; }
  #hud .pill { background: rgba(255,255,255,.88); border-radius: 2em; padding: .25em .8em; box-shadow: 0 .15em 0 rgba(0,0,0,.15); font-weight: 700; }
  #hud .grow { flex: 1; }
  #hearts { color: #e8344e; letter-spacing: .1em; }
  #hint { font-size: .8em; font-weight: 600; opacity: .85; }

  /* sign box */
  #sign { position: absolute; left: 50%; top: 3.4em; transform: translateX(-50%); width: 62%;
    background: #fffbea; border: .2em solid #a8743a; border-radius: .7em; padding: .6em .9em; font-size: 1em;
    box-shadow: 0 .3em 0 rgba(0,0,0,.2); display: none; line-height: 1.45; pointer-events: none; }
  #sign.show { display: block; }
  #sign .title { font-weight: 800; color: #8a5a22; margin-bottom: .2em; font-size: .85em; text-transform: uppercase; letter-spacing: .05em; }

  /* overlays */
  #overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(20,22,52,.55); }
  #overlay.show { display: flex; }
  .card { background: #fff; border-radius: 1em; padding: 1.2em 1.6em; width: 78%; max-height: 92%; overflow: auto;
    box-shadow: 0 .4em 0 rgba(0,0,0,.25); text-align: center; line-height: 1.45; }
  .card h1 { margin: .1em 0 .2em; font-size: 2.6em; color: #5a3cf0; letter-spacing: .03em; }
  .card h2 { margin: .1em 0 .4em; font-size: 1.6em; color: #5a3cf0; }
  .card h3 { margin: .6em 0 .2em; font-size: 1.05em; color: #333; }
  .card p { margin: .35em 0; }
  .tag { display: inline-block; background: #ffe066; color: #5c4400; font-weight: 800; border-radius: 2em; padding: .1em .8em; font-size: .8em; letter-spacing: .05em; }
  .row { display: flex; gap: .7em; justify-content: center; flex-wrap: wrap; margin-top: .8em; }
  .cols { display: flex; gap: 1em; text-align: left; align-items: flex-start; }
  .cols > div { flex: 1; }
  .btn { font: inherit; font-weight: 800; font-size: 1.05em; border: 0; border-radius: .6em; padding: .55em 1.3em; cursor: pointer;
    background: #5a3cf0; color: #fff; box-shadow: 0 .25em 0 #3a22b0; }
  .btn:active { transform: translateY(.15em); box-shadow: 0 .1em 0 #3a22b0; }
  .btn:focus-visible { outline: .2em solid #ffcc33; outline-offset: .15em; }
  .btn, .opt { touch-action: manipulation; }
  .btn.alt { background: #e9e6ff; color: #3a22b0; box-shadow: 0 .25em 0 #b9b0f0; }
  .btn:disabled { background: #ccc; color: #777; box-shadow: none; cursor: default; }
  .keys { font-size: .9em; color: #555; }
  kbd { display: inline-block; background: #f1f1f8; border: 1px solid #bbb; border-bottom-width: 3px; border-radius: .35em;

  .opts { display: flex; flex-direction: column; gap: .55em; margin-top: .7em; }
  .opt { display: flex; align-items: stretch; gap: .6em; text-align: left; font: inherit; border: .18em solid #d6d3f5; background: #f7f6ff;
    border-radius: .7em; padding: .45em; cursor: pointer; color: inherit; }
  .opt .n { background: #5a3cf0; color: #fff; font-weight: 800; border-radius: .4em; min-width: 1.8em; display: flex; align-items: center; justify-content: center; }
  .opt pre { flex: 1; }
  .opt:focus-visible { outline: .2em solid #ffcc33; }
  .opt.wrong { border-color: #e8344e; background: #ffecef; opacity: .75; }
  .opt.wrong .n { background: #e8344e; }
  .opt.right { border-color: #26b35a; background: #e8fff0; }
  .opt.right .n { background: #26b35a; }
  #fb { margin-top: .6em; min-height: 1.4em; font-weight: 600; }
  #fb.bad { color: #c41f3a; } #fb.good { color: #168a43; }
  .muted { color: #777; font-size: .85em; }
  code, pre, kbd, #coinvar { font-variant-ligatures: none; font-feature-settings: 'liga' 0, 'calt' 0; }
  .ph { font-size: 1.2em !important; color: #3a22b0 !important; margin: .1em 0 .4em !important; }
  .lesson { align-items: flex-start; } .lesson > div:first-child { flex: 1.15; }
  .lesson p { margin: .3em 0 .5em; }
  .parts { list-style: none; padding: 0; margin: .5em 0 0; font-size: .92em; }
  .parts li { display: flex; gap: .5em; align-items: baseline; margin: .25em 0; }
  .parts li code { flex: none; min-width: 4.2em; text-align: center; }
  .dots { display: flex; gap: .4em; justify-content: center; margin-top: .6em; }
  .dots i { width: .55em; height: .55em; border-radius: 50%; background: #d6d3f5; } .dots i.on { background: #5a3cf0; }
  .goal { font-size: 1.1em; }
  .recap { text-align: left; margin: .4em auto; padding-left: 1.6em; max-width: 40em; }
  .recap li { margin: .3em 0; padding: .1em .3em; border-radius: .4em; }
  .recap li.hi { background: #fff3c4; }
  .ref { margin-top: .35em; padding: .3em .6em; background: #fff3c4; color: #5c4400; border-radius: .5em; font-weight: 500; text-align: left; }
  .row.small { margin-top: .5em; } .row.small .btn { font-size: .85em; padding: .4em .9em; }
  .levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(8em, 1fr)); gap: .6em; margin-top: .6em; }
  .levels .btn { font-size: .95em; padding: .6em .4em; }
  .levels .btn .st { display: block; font-size: .78em; font-weight: 600; opacity: .85; margin-top: .2em; }
  .worlds { display: grid; grid-template-columns: repeat(5, 1fr); gap: .55em; margin-top: .6em; }
  .wbtn { font: inherit; cursor: pointer; border: 0; border-radius: .8em; padding: .55em .3em; color: #fff; text-align: center;
    background: linear-gradient(160deg, var(--wa), var(--wb)); box-shadow: 0 .25em 0 rgba(0,0,0,.25); display: flex; flex-direction: column; align-items: center; gap: .1em;
    text-shadow: 0 1px 2px rgba(0,0,0,.55); min-height: 44px; }
  .wbtn:focus-visible, .wbtn:hover { outline: .2em solid #ffd23f; }
  .wbtn .we { font-size: 1.6em; line-height: 1.1; } .wbtn b { font-size: .95em; } .wbtn .wn { font-size: .8em; font-weight: 700; }
  .wbtn .ws { font-size: .75em; background: rgba(0,0,0,.3); border-radius: 1em; padding: 0 .5em; }
  .wbtn:disabled { filter: grayscale(.85) brightness(.8); cursor: not-allowed; }
  .wbtn.cur { outline: .2em solid #ffd23f; }
  pre.prog { text-align: left; margin: .4em auto; max-width: 34em; }
  pre.prog .ln { display: inline-block; width: 1.8em; color: #8a88b0; user-select: none; }
  body.dev-phone .worlds { gap: .35em; } body.dev-phone .wbtn .wn { font-size: .7em; }
  .mode { font-size: .75em; color: #8a88b0; margin: .6em 0 0; letter-spacing: .03em; }
  .tk { display: inline-block; background: #5a3cf0; color: #fff; border-radius: .4em; padding: 0 .45em; font-weight: 800; font-size: .9em; line-height: 1.4; }

  /* ---------- touch controls ---------- */
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; z-index: 5; }
  body.in-touch.st-play #touch { display: block; }
  .tbtn { position: absolute; width: var(--tb, 84px); height: var(--tb, 84px); border-radius: 50%; pointer-events: auto; touch-action: none;
    display: flex; align-items: center; justify-content: center; font-size: calc(var(--tb, 84px) * .42); font-weight: 900; color: #fff;
    background: rgba(36,38,74,.3); border: 3px solid rgba(255,255,255,.7); box-shadow: 0 4px 0 rgba(0,0,0,.25);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .tbtn.on { background: rgba(90,60,240,.8); transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .tbtn small { position: absolute; bottom: 12%; font-size: .32em; letter-spacing: .05em; opacity: .9; }
  #tLeft  { left: calc(var(--sl) + var(--tg)); bottom: calc(var(--sb) + var(--tg)); }
  #tRight { left: calc(var(--sl) + var(--tg) * 2 + var(--tb)); bottom: calc(var(--sb) + var(--tg)); }
  #tJump  { right: calc(var(--sr) + var(--tg)); bottom: calc(var(--sb) + var(--tg)); width: calc(var(--tb) * 1.15); height: calc(var(--tb) * 1.15); background: rgba(38,179,90,.5); }
  #tJump.on { background: rgba(38,179,90,.9); }
  body.dev-phone .tbtn { background: rgba(36,38,74,.2); }
  body.dev-phone #tJump { background: rgba(38,179,90,.35); }
  #tPause { display: none; pointer-events: auto; touch-action: none; font: inherit; font-weight: 900; font-size: 1.1em; border: 0; cursor: pointer;
    min-width: 44px; min-height: 44px; width: 2.6em; height: 2.6em; border-radius: 50%; background: rgba(255,255,255,.92); color: #3a22b0;
    box-shadow: 0 .15em 0 rgba(0,0,0,.2); }
  body.in-touch #tPause { display: inline-flex; align-items: center; justify-content: center; }
  #tFs { display: inline-flex; align-items: center; justify-content: center; pointer-events: auto; font: inherit; font-weight: 900; font-size: 1.1em; border: 0; cursor: pointer;
    min-width: 44px; min-height: 44px; width: 2.6em; height: 2.6em; border-radius: 50%; background: rgba(255,255,255,.92); color: #3a22b0;
    box-shadow: 0 .15em 0 rgba(0,0,0,.2); padding: 0; }
  body.in-keys #tFs { min-width: 0; min-height: 0; width: 2em; height: 2em; font-size: 1em; }
  body.in-touch #hint { display: none; }

  /* ---------- phone: bigger text, simpler HUD ---------- */
  body.dev-phone #lvname, body.dev-phone #hint { display: none; }
  body.dev-phone .card { width: 94%; max-height: 96%; padding: .8em 1em; }
  body.dev-phone .card h1 { font-size: 2em; }
  body.dev-phone #sign { width: 80%; }
  .card { -webkit-overflow-scrolling: touch; touch-action: pan-y; }

  /* ---------- orientation prompts ---------- */
  #rotate { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1em;
    background: #1b1d3a; color: #fff; text-align: center; padding: 2em; font-size: 20px; }
  #rotate.show { display: flex; }
  #rotate .ph { font-size: 64px; animation: rot 2s ease-in-out infinite; }
  @keyframes rot { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
  #rotate button { font: inherit; font-size: 14px; background: none; color: #aab; border: 1px solid #556; border-radius: 2em; padding: .4em 1em; }
  #tip { position: fixed; left: 50%; transform: translateX(-50%); top: calc(var(--st, 0px) + 12px); z-index: 6; display: none; background: rgba(255,255,255,.12);
    color: #dfe0ff; border-radius: 2em; padding: .4em 1.1em; font-size: 15px; pointer-events: none; white-space: nowrap; }
  #tip.show { display: block; }
</style>

<body>
<div id="loading" style="position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#1b1d3a;color:#fff;font:700 22px system-ui,sans-serif">Loading… 🎮</div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="hud" style="display:none">
    <span class="pill" id="hearts"></span>
    <span class="pill"><code id="coinvar">coins = 0</code></span>
    <span class="grow"></span>
    <span class="pill" id="lvname"></span>
    <span class="pill" id="hint"></span>
    <button id="tFs" aria-label="Fullscreen">⛶</button>
    <button id="tPause" aria-label="Pause">⏸</button>
  </div>
  <div id="sign"><div class="title">📜 Sign</div><div id="signtext"></div></div>
  <div id="overlay"><div class="card" id="card"></div></div>
</div>
<div id="touch" aria-hidden="true">
  <div class="tbtn" id="tLeft">◀</div><div class="tbtn" id="tRight">▶</div><div class="tbtn" id="tJump">⬆<small>JUMP</small></div>
</div>
<div id="tip">↻ Turn your tablet sideways for a bigger view</div>
<div id="rotate"><div class="ph">📱</div><b style="font-size:1.3em">Please rotate your phone</b><div>Code Quest plays in <b>landscape</b> (sideways).</div>
  <button id="bPortrait">Play in portrait anyway</button></div>
<div id="safe"></div>
<script>
"use strict";
// ======================================================================
//  CODE QUEST – an educational 2D platformer (pure JS, no libraries)
// ======================================================================
const TILE = 40, ROWS = 13, VW = 960, VH = 540;
const GRAV = 2000, JUMP_V = 760, RUN = 250, MAXFALL = 950, SPRING_V = 1150, DT = 1 / 60;

// ---------- control wording (single place so other input modes can be added later) ----------
const CTRL_SETS = {
  keys: {
    move: '<kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd>',
    jump: '<kbd>Space</kbd>, <kbd>↑</kbd> or <kbd>W</kbd>',
    jumpVerb: 'press <kbd>Space</kbd>',
    hold: 'hold it',
    pause: '<kbd>P</kbd> or <kbd>Esc</kbd>',
    mute: '<kbd>M</kbd>',
    fs: '<kbd>F</kbd> or the ⛶ button',
    pick: 'the number keys (<kbd>1</kbd>, <kbd>2</kbd>, <kbd>3</kbd>…) or a click',
    startHint: 'Press <kbd>Enter</kbd> or click Start',
    resumeHint: 'Press <kbd>P</kbd> or <kbd>Esc</kbd> to resume',
    quizHint: 'Choose with the number keys (<kbd>1</kbd>, <kbd>2</kbd>, <kbd>3</kbd>…) or click',
    contHint: 'Press <kbd>Enter</kbd> to continue',
    nextHint: 'Press <kbd>Enter</kbd> for the next page, or click Next',
    recapHint: 'Press <kbd>Enter</kbd> when you\'re ready',
    hud: 'P = pause · M = mute',
  },
  touch: {
    move: 'the <span class="tk">◀</span> <span class="tk">▶</span> buttons (bottom-left)',
    jump: 'the <span class="tk">⬆</span> jump button (bottom-right)',
    jumpVerb: 'tap the jump button',
    hold: 'keep your finger on it',
    pause: 'tap <span class="tk">⏸</span> (top-right)',
    mute: 'in the pause menu',
    fs: 'tap ⛶ (top-right)',
    pick: 'a tap',
    startHint: 'Tap <b>Start level</b> when you\'re ready',
    resumeHint: 'Tap <b>Resume</b> to keep playing',
    quizHint: 'Tap the code you think is right',
    contHint: 'Tap <b>Continue</b>',
    nextHint: 'Tap <b>Next</b> to keep reading',
    recapHint: 'Tap <b>Show me the question</b> when you\'re ready',
    hud: '',
  },
};
const CTRL = { ...CTRL_SETS.keys };
const subCtl = s => s.replace(/\{(\w+)\}/g, (m, k) => (k in CTRL) ? CTRL[k] : m);
// ctl() remembers its template so the wording can be swapped live when the control mode changes
const ctl = s => `<span class="ctl" data-t="${encodeURIComponent(s)}">${subCtl(s)}</span>`;
function refreshCtl() {
  document.querySelectorAll('.ctl').forEach(el => { el.innerHTML = subCtl(decodeURIComponent(el.dataset.t)); });
  const h = document.getElementById('hint'); if (h) h.textContent = CTRL.hud;
}

// ---------- tiny syntax highlighter for code snippets ----------
function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function hl(src) {
  const esc = src.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return esc.replace(/("[^"]*")|\b(let|const|if|else|for|while|function|return|true|false|break|this|undefined|null|NaN)\b|\b(\d+)\b|\b([a-zA-Z_]\w*)(?=\()/g,
    (m, s, k, n, f) => s ? `<span class="str">${s}</span>` : k ? `<span class="kw">${k}</span>` : n ? `<span class="num">${n}</span>` : `<span class="fn">${f}</span>`);
}

// small seeded random generator so every level is the same each time you play it
function rng(seed) {
  return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const TERMINAL_SIGN = 'Terminal ahead! 🖥️ It shows a recap of these signs, then asks the question. You can always re-read the lesson there.';

// ---------- level generator: builds the map for worlds 2-10 from each level's feature list ----------
// difficulty d grows with the world (and a little with each level): wider gaps, more spikes,
// more + faster enemies, faster moving platforms, taller spring walls, pillar hops.
function genGeometry(L) {
  const W = WORLDS[L.wi], wi = L.wi, li = L.li, R = rng(7919 * (wi + 1) + 131 * (li + 1));
  const d = wi + li * 0.25;
  if (!L.signs) L.signs = L.boss ? [L.hello, ...L.recap] : [L.hello, ...L.recap, TERMINAL_SIGN];
  L.sky = L.sky || (L.boss ? W.bossSky : W.sky); L.hill = L.hill || W.hill;
  L.enemySpeed = L.enemySpeed || Math.round(60 + 6 * wi + 2 * li);
  L.difficulty = d;
  const put = [], ground = [], movers = [];
  const P = (r, c, s) => put.push([r, c, s]);
  if (L.boss) {
    const n = L.signs.length, w = 16 + 5 * n;
    ground.push([0, w - 1]);
    for (let r = 0; r <= 10; r++) { P(r, 0, '#'); P(r, w - 1, '#'); }
    P(10, 3, 'P');
    for (let k = 0; k < n; k++) P(10, 6 + 5 * k, 'S');
    let plat = 0;
    for (let x = 8; x < w - 12; x += 10, plat++) {
      P(8, x, '====='); P(7, x + 1, 'ooo');
      if (wi >= 2 && plat % 2 === 1) { P(5, x + 6, '==='); P(4, x + 7, 'o'); }
      if (wi >= 4 && plat % 2 === 0 && plat > 0) P(7, x + 2, 'e');
    }
    P(10, Math.floor(w * 0.6), 'B');
    P(10, w - 4, 'T');
    Object.assign(L, { w, ground, put, movers });
    return;
  }
  let c = 5, segStart = 0, coins = 0, groundCoins = 0, gateReq = 0, ki = 0;
  const brk = (a, n) => { ground.push([segStart, a - 1]); segStart = a + n; };
  P(10, 2, 'P');
  const hasGate = L.feat.includes('gate'), kinds = L.feat.filter(f => f !== 'gate');
  const nS = L.signs.length, gateSection = Math.max(1, Math.floor((nS - 1) / 2));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ob = {
    gap() {
      const pillar = d >= 4 && R() < 0.45;
      if (pillar) { // gap, a 2-high pillar, gap: a trickier double jump
        const ga = 2 + (R() < d / 12 ? 1 : 0), gb = 2 + (R() < d / 10 ? 1 : 0);
        brk(c + 1, ga); const p = c + 1 + ga; P(9, p, '='); P(10, p, '='); P(8, p, 'o'); coins++;
        ground.push([p, p]); segStart = p + 1; brk(p + 1, gb); c = p + 1 + gb + 2;
      } else {
        const gw = clamp(2 + Math.floor(R() * (1 + d / 3)), 2, d < 3 ? 3 : 4);
        brk(c + 1, gw); P(8, c + 1 + Math.floor(gw / 2), 'o'); coins++; c += gw + 3;
      }
    },
    spikes() {
      const sw = clamp(1 + Math.floor(R() * (1 + d / 4)), 1, 3);
      P(10, c + 2, '^'.repeat(sw)); if (d >= 3) { P(7, c + 2 + Math.floor(sw / 2), 'o'); coins++; }
      c += sw + 4;
    },
    enemy() {
      const n = clamp(1 + Math.floor(d / 3.5) + (R() < 0.3 ? 1 : 0), 1, 3), len = 5 + 3 * n;
      P(10, c + 1, '='); for (let k = 0; k < n; k++) P(10, c + 3 + 3 * k, 'e'); P(10, c + len + 2, '=');
      c += len + 4;
    },
    bricks() {
      P(8, c + 1, '====='); P(7, c + 2, 'ooo'); coins += 3;
      if (d >= 3) { P(5, c + 6, '==='); P(4, c + 7, 'o'); coins++; }
      if (d >= 5) P(7, c + 1, 'e');
      c += d >= 3 ? 11 : 8;
    },
    movers() {
      const r = d >= 6 ? 8 : 9, period = Math.round(Math.max(3.0, 4.4 - d * 0.15) * 10) / 10;
      brk(c + 1, 8); movers.push({ c, r, w: 3, range: 6, period }); P(r - 2, c + 3, 'o o'); coins += 2;
      c += 11;
    },
    spring() {
      const h = 5 + (d >= 4 ? 1 : 0) + (d >= 7 ? 1 : 0);
      P(10, c + 1, 'J'); for (let r = 11 - h; r <= 10; r++) P(r, c + 4, '==');
      P(10 - h, c + 4, 'oo'); coins += 2; c += 9;
    },
  };
  for (let s = 0; s < nS; s++) {
    // rest area: sign, three ground coins, checkpoint flag
    P(10, c + 1, 'S'); P(10, c + 3, 'ooo'); coins += 3; groundCoins += 3;
    if (s > 0 && s % 2 === 0) P(10, c + 6, 'F');
    c += 8;
    if (s === nS - 1) break;
    if (hasGate && s === gateSection) {
      gateReq = Math.min(groundCoins, Math.max(3, Math.round(coins * 0.6)));
      for (let r = 6; r <= 10; r++) P(r, c + 3, 'G');
      c += 7;
    }
    const nObs = 1 + (R() < Math.min(0.9, d / 7) ? 1 : 0);
    for (let k = 0; k < nObs; k++) { ob[kinds[ki % kinds.length]](); ki++; c += 1; }
  }
  P(10, c + 3, 'T'); c += 7;
  ground.push([segStart, c - 1]);
  Object.assign(L, { w: c, ground, put, movers, gateReq });
}

const LEVELS = [];
[W1_LEVELS, ...WORLD_CONTENT].forEach((arr, wi) => arr.forEach((L, li) => {
  Object.assign(L, { wi, li, idx: LEVELS.length, label: `World ${wi + 1} - Level ${li + 1}` });
  if (!L.w) genGeometry(L); else L.difficulty = L.difficulty || li * 0.25;
  LEVELS.push(L);
}));

function buildLevel(idx) {
  const def = LEVELS[idx], W = def.w;
  const grid = [];
  for (let r = 0; r < ROWS; r++) grid.push(new Array(W).fill('.'));
  for (const [a, b] of def.ground) for (let c = a; c <= b; c++) { grid[11][c] = '#'; grid[12][c] = '#'; }
  for (const [r, c, s] of def.put) for (let i = 0; i < s.length; i++) if (s[i] !== ' ') grid[r][c + i] = s[i];
  const lv = { idx, def, w: W, grid, coins: [], enemies: [], signs: [], checks: [], movers: [], terminal: null, boss: null,
    start: null, gateReq: def.gateReq || 0, gateOpen: !def.gateReq, gateAnim: 0, t: 0, totalCoins: 0,
    world: WORLDS[def.wi], bossCfg: WORLDS[def.wi].boss, enemySpeed: def.enemySpeed || 60, rnd: rng(977 * idx + 3),
    gateLabel: (def.gateLabel || 'if (coins >= N)').replace('N', def.gateReq || 0), moverLabel: def.moverLabel || (def.wi === 0 ? 'loop ↔' : 'while(true)') };
  let signN = 0;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < W; c++) {
    const ch = grid[r][c], x = c * TILE, y = r * TILE;
    let clear = true;
    if (ch === 'P') lv.start = { x: x + 6, y: y + TILE - 36 };
    else if (ch === 'o') lv.coins.push({ x: x + 20, y: y + 20, got: false });
    else if (ch === 'e') lv.enemies.push({ x: x + 5, y: y + 16, w: 30, h: 24, vx: -(def.enemySpeed || 60), vy: 0, dir: -1, dead: false, squash: 0 });
    else if (ch === 'S') lv.signs.push({ x, y, text: def.signs[signN++] || '' });
    else if (ch === 'F') lv.checks.push({ x, y, on: false });
    else if (ch === 'T') lv.terminal = { x: x - 4, y: y - 20, w: 48, h: 60 };
    else if (ch === 'B') lv.boss = { x: x - 20, y: y - 24, w: 76, h: 64, vx: -lv.bossCfg.base, vy: 0, dir: -1, hp: lv.bossCfg.hp, inv: 0, hopT: 2, dead: false, deadT: 0 };
    else clear = false;
    if (clear) grid[r][c] = '.';
  }
  lv.totalCoins = lv.coins.length;
  for (const m of (def.movers || [])) lv.movers.push({ ...m, x: m.c * TILE, y: m.r * TILE, pw: m.w * TILE });
  return lv;
}

// ======================================================================
//  PHYSICS (pure functions on a body + level, reused by the solver test)
// ======================================================================
function solidAt(lv, c, r) {
  if (c < 0 || c >= lv.w) return true;
  if (r < 0 || r >= ROWS) return false;
  const ch = lv.grid[r][c];
  return ch === '#' || ch === '=' || ch === 'J' || (ch === 'G' && !lv.gateOpen);
}
function moverX(m, t) { return m.x + m.range * TILE * (0.5 - 0.5 * Math.cos(2 * Math.PI * t / m.period)); }

function moveBody(lv, b, dt, t, extraDx = 0) {
  b.hitWall = false; b.landedOn = null;
  // ---- X ----
  b.x += b.vx * dt + extraDx;
  let r0 = Math.floor(b.y / TILE), r1 = Math.floor((b.y + b.h - 0.001) / TILE);
  let c0 = Math.floor(b.x / TILE), c1 = Math.floor((b.x + b.w - 0.001) / TILE);
  const goingRight = (b.vx * dt + extraDx) > 0;
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (solidAt(lv, c, r)) {
    if (goingRight) b.x = c * TILE - b.w; else b.x = (c + 1) * TILE;
    b.vx = 0; b.hitWall = true;
    c0 = Math.floor(b.x / TILE); c1 = Math.floor((b.x + b.w - 0.001) / TILE);
  }
  // ---- Y ----
  const prevBottom = b.y + b.h;
  b.y += b.vy * dt;
  b.grounded = false;
  c0 = Math.floor(b.x / TILE); c1 = Math.floor((b.x + b.w - 0.001) / TILE);
  r0 = Math.floor(b.y / TILE); r1 = Math.floor((b.y + b.h - 0.001) / TILE);
  outer: for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) if (solidAt(lv, c, r)) {
    if (b.vy > 0) { b.y = r * TILE - b.h; b.grounded = true; b.landedOn = lv.grid[r] ? lv.grid[r][c] : '#'; }
    else if (b.vy < 0) { b.y = (r + 1) * TILE; }
    b.vy = 0; break outer;
  }
  // ---- one-way moving platforms ----
  b.onMover = null;
  if (b.vy >= 0) for (const m of lv.movers) {
    const mx = moverX(m, t);
    if (b.x + b.w > mx + 2 && b.x < mx + m.pw - 2 && prevBottom <= m.y + 1 && b.y + b.h >= m.y) {
      b.y = m.y - b.h; b.vy = 0; b.grounded = true; b.onMover = m;
    }
  }
}

function newPlayer(lv) { return { x: lv.start.x, y: lv.start.y, w: 28, h: 36, vx: 0, vy: 0, face: 1, grounded: false, coyote: 0, buffer: 0, onMover: null, anim: 0 }; }

function stepPlayer(lv, p, inp, dt, t) {
  const dir = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  const target = dir * RUN, acc = p.grounded ? 2600 : 1700;

const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function touchesSpikes(lv, p) {

function update(dt) {

  jumpEdge = false;

  p.anim += Math.abs(p.vx) * dt;
  if (G.inv > 0) G.inv -= dt;
  if (G.msgT > 0) G.msgT -= dt;

  // coins
  for (const c of lv.coins) if (!c.got && Math.abs(p.x + p.w / 2 - c.x) < 24 && Math.abs(p.y + p.h / 2 - c.y) < 28) {
    c.got = true; G.coinsHere++; SFX.coin(); burst(c.x, c.y, '#ffd23f', 6); floater(c.x - 30, c.y - 20, `coins = ${G.coinsHere}`, '#7a5a00'); updateHud();
  }

  if (!lv.gateOpen && G.coinsHere >= lv.gateReq) { lv.gateOpen = true; SFX.gate(); flash(`${lv.gateLabel} → true! Gate opened 🎉`); }
  if (lv.gateOpen && lv.gateAnim < 1) lv.gateAnim = Math.min(1, lv.gateAnim + dt * 1.5);

  for (const f of lv.checks) if (!f.on && overlap(p, { x: f.x, y: f.y - 40, w: 40, h: 80 })) {
    lv.checks.forEach(o => { if (o.x < f.x) o.on = true; }); f.on = true; G.checkpoint = { x: f.x + 6, y: f.y + 4 }; SFX.check(); flash('Checkpoint saved ✔', 1.5);
  }
  // signs
  let near = null;
  for (const s of lv.signs) if (overlap(p, { x: s.x - 30, y: s.y - 80, w: 100, h: 120 })) near = s;
  if (near !== G.sign) { G.sign = near; $('signtext').innerHTML = near ? ctl(near.text) : ''; $('sign').classList.toggle('show', !!near); }

    if (B.dead) { ctx.globalAlpha = Math.max(0, 1 - B.deadT); }
    if (B.inv > 0 && Math.floor(B.inv * 12) % 2) ctx.globalAlpha = 0.4;
    const BC = lv.bossCfg;
    drawBug(B.x - cam, B.y, B.w, B.h, B.dir, t, BC.col);

      ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.moveTo(cx - 20, B.y + 4); ctx.lineTo(cx - 20, B.y - 14); ctx.lineTo(cx - 10, B.y - 4);
      ctx.lineTo(cx, B.y - 18); ctx.lineTo(cx + 10, B.y - 4); ctx.lineTo(cx + 20, B.y - 14); ctx.lineTo(cx + 20, B.y + 4); ctx.fill();
    } else { // the boss wears its code symbol as a badge

      const gw = Math.max(34, ctx.measureText(BC.glyph).width + 14);
      ctx.fillStyle = '#ffd23f'; rr(cx - gw / 2, B.y - 18, gw, 24, 7); ctx.fill(); ctx.strokeStyle = '#7a5a00'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#3a2a00'; ctx.fillText(BC.glyph, cx, B.y + 1); ctx.textAlign = 'left';

      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center'; ctx.fillText(`${lv.bossCfg.id}.hp = ${B.hp}`, cx, B.y - 31); ctx.textAlign = 'left';

function drawBug(x, y, w, h, dir, t, col) {

  ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x + w / 2, y + h * .5, w / 2, h * .45, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.moveTo(x + w / 2, y + h * .1); ctx.lineTo(x + w / 2, y + h * .9); ctx.stroke();
  ctx.fillStyle = '#222'; for (const [a, b] of [[.3, .35], [.7, .55], [.35, .7]]) { ctx.beginPath(); ctx.arc(x + w * a, y + h * b, w / 14, 0, 7); ctx.fill(); }

  ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(ex - 4 * (w / 30) + dir * 1.5, y + h * .33, w / 20, 0, 7); ctx.arc(ex + 4 * (w / 30) + dir * 1.5, y + h * .33, w / 20, 0, 7); ctx.fill();
}
function drawPlayer(p, cam) {
  if (G.inv > 0 && Math.floor(G.inv * 12) % 2) return;
  const x = p.x - cam, y = p.y, f = p.face;
  const step = p.grounded && Math.abs(p.vx) > 20 ? Math.sin(p.anim / 9) * 4 : 0;
  ctx.fillStyle = '#2a2d5c'; ctx.fillRect(x + 5, y + 28 + Math.max(0, step), 7, 8 - Math.max(0, step)); ctx.fillRect(x + 16, y + 28 + Math.max(0, -step), 7, 8 - Math.max(0, -step));

  ctx.fillStyle = '#ffd9b3'; rr(x + 2, y, 24, 18, 6); ctx.fill(); // face
  ctx.fillStyle = '#3a2a1a'; rr(x + 1, y - 2, 26, 7, 3); ctx.fill(); // hair

}

function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  const lv = G.lv;
  if (!lv) { titleBackdrop(); return; }
  const cam = Math.round(G.cam);
  ctx.save(); ctx.translate(0, VH - ROWS * TILE); // align level bottom with screen bottom
  drawBackground(lv, cam);

  ctx.globalAlpha = 1;

  for (const f of G.floaters) { ctx.globalAlpha = Math.min(1, f.life * 1.5); ctx.fillStyle = '#fff'; ctx.fillText(f.text, f.x - cam + 1, f.y + 1); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x - cam, f.y); }
  ctx.globalAlpha = 1; ctx.restore();
  if (G.msgT > 0 && G.msg) {
    ctx.font = 'bold 20px sans-serif'; const w = ctx.measureText(G.msg).width + 40;
    ctx.globalAlpha = Math.min(1, G.msgT * 2);
    ctx.fillStyle = 'rgba(36,38,74,.88)'; rr(VW / 2 - w / 2, VH - 96, w, 40, 20); ctx.fill();

function titleBackdrop() {

  setState('win'); SFX.good();
  show(`<span class="tag">YOU WIN!</span><h1>🏆 Code Quest complete!</h1>
    <p>You defeated ${WORLDS[WORLDS.length - 1].boss.title} and finished all ${WORLDS.length} worlds. You now know the building blocks of programming:</p>
    <p><code>variables</code> <code>maths</code> <code>strings</code> <code>booleans</code> <code>if / else</code> <code>loops</code> <code>functions</code> <code>arrays</code> <code>objects</code> <code>debugging</code></p>
    <p>Total coins collected: <b>${total}</b> &nbsp;·&nbsp; Stars: <b>${stars}</b> / ${LEVELS.length * 3}</p>
    <p class="muted">Next step: try writing these yourself in your browser's console (F12) or on a site like Scratch or freeCodeCamp!</p>
    <div class="row"><button class="btn" id="bAgain">Play again</button><button class="btn alt" id="bLevels">World map</button></div>`);
  on('bAgain', () => introScreen(0)); on('bLevels', () => { G.lv = null; setState('title'); worldMap(); });
}

// ======================================================================
//  INPUT (keyboard)
// ======================================================================
window.addEventListener('keydown', e => {
  const code = e.code;
  audioUnlock();
  if (DEV.autoInput !== 'keys' && !['Unidentified', ''].includes(code)) { DEV.autoInput = 'keys'; applyMode(); }
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(code) && G.state === 'play') e.preventDefault();
  if (code === 'KeyM') { setMuted(!muted); flash(muted ? 'Sound off 🔇' : 'Sound on 🔊', 1); return; }
  if (code === 'KeyF' && !e.repeat) { toggleFullscreen(); e.preventDefault(); return; }
  if (G.state === 'play') {
    if (!e.repeat && K.jump.includes(code)) jumpEdge = true;
    keys.add(code);
    if (code === 'KeyP' || code === 'Escape') pauseScreen();
    return;
  }
  if (G.state === 'pause' && (code === 'KeyP' || code === 'Escape')) { resume(); return; }
  if (G.state === 'quiz') {
    const m = code.match(/^(?:Digit|Numpad)([1-9])$/);
    if (m) { answer(+m[1] - 1); e.preventDefault(); return; }
  }
  // menu navigation with arrow keys
  if ($('overlay').classList.contains('show') && /^Arrow/.test(code)) {
    const items = [...$('card').querySelectorAll('.btn:not(:disabled), .opt:not(:disabled)')];
    if (!items.length) return;
    let i = items.indexOf(document.activeElement);
    i = (code === 'ArrowDown' || code === 'ArrowRight') ? (i + 1) % items.length : (i - 1 + items.length) % items.length;
    items[i].focus(); e.preventDefault();
  }
  if (code === 'Enter' && $('overlay').classList.contains('show') && !$('card').contains(document.activeElement)) {
    const b = $('card').querySelector('.pri:not(:disabled)') || $('card').querySelector('.btn:not(:disabled)'); if (b) { b.click(); e.preventDefault(); }
  }
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); clearTouch(); if (G.state === 'play') pauseScreen(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play') pauseScreen(); });

// ======================================================================
//  DEVICE DETECTION + CONTROL MODE
// ======================================================================
function detectDevice() {
  const mm = q => !!(window.matchMedia && window.matchMedia(q).matches);
  const ua = navigator.userAgent || '', mtp = navigator.maxTouchPoints || 0;
  const coarse = mm('(pointer: coarse)'), anyCoarse = mm('(any-pointer: coarse)'), anyFine = mm('(any-pointer: fine)'), hover = mm('(hover: hover)');
  const uaMobile = navigator.userAgentData ? navigator.userAgentData.mobile : undefined;
  const iPadOS = navigator.platform === 'MacIntel' && mtp > 1;            // iPadOS Safari pretends to be a Mac
  const isIPad = /iPad/.test(ua) || iPadOS;
  const isIPhone = /iPhone|iPod/.test(ua);
  const isAndroid = /Android/.test(ua);
  const phoneUA = isIPhone || (isAndroid && /Mobile/.test(ua)) || /Windows Phone|IEMobile|Opera Mini/.test(ua) || uaMobile === true;
  const tabletUA = isIPad || (isAndroid && !/Mobile/.test(ua)) || /Tablet|Silk|Kindle|PlayBook/.test(ua);
  const touch = mtp > 0 || 'ontouchstart' in window || anyCoarse;
  const shortSide = Math.min(screen.width || innerWidth, screen.height || innerHeight);
  let type;
  const forced = (location.search.match(/[?&]device=(phone|tablet|desktop)/) || [])[1];
  if (forced) type = forced;
  else if (isIPad) type = 'tablet';
  else if (phoneUA) type = 'phone';
  else if (tabletUA) type = shortSide < 600 ? 'phone' : 'tablet';
  else if (touch && (coarse || (!anyFine && !hover))) type = shortSide < 600 ? 'phone' : 'tablet';  // touch-first device, unknown UA
  else type = 'desktop';                                                                             // includes touch-screen laptops
  const name = type === 'tablet' ? (isIPad ? 'iPad' : 'Tablet') : type === 'phone' ? (isIPhone ? 'iPhone' : 'Phone') : 'Desktop';
  return { type, name, touch, autoInput: type === 'desktop' ? 'keys' : 'touch',
    pref: ['auto', 'touch', 'keys'].includes(localStorage.getItem('cq_ctrl')) ? localStorage.getItem('cq_ctrl') : 'auto',
    info: { ua, mtp, coarse, anyCoarse, anyFine, hover, uaMobile, iPadOS, shortSide, platform: navigator.platform } };
}
const DEV = detectDevice();
G.dev = DEV;
const inputMode = () => DEV.pref === 'auto' ? DEV.autoInput : DEV.pref;
G.input = inputMode;
const modeLabel = () => `Mode: ${DEV.name} / ${inputMode() === 'touch' ? 'touch' : 'keyboard'}`;
const ctrlLabel = () => 'Controls: ' + (DEV.pref === 'auto' ? `Auto (${DEV.autoInput === 'touch' ? 'touch' : 'keyboard'})` : DEV.pref === 'touch' ? 'Touch' : 'Keyboard');
function cycleCtrlPref() {
  DEV.pref = { auto: 'touch', touch: 'keys', keys: 'auto' }[DEV.pref];
  localStorage.setItem('cq_ctrl', DEV.pref); applyMode();
}
let lastApplied = '';
function applyMode() {
  const inp = inputMode();
  Object.assign(CTRL, CTRL_SETS[inp]);
  const b = document.body;
  b.classList.remove('dev-desktop', 'dev-tablet', 'dev-phone', 'in-touch', 'in-keys');
  b.classList.add('dev-' + DEV.type, 'in-' + inp);
  refreshCtl();
  document.querySelectorAll('#modeLbl').forEach(el => el.textContent = modeLabel());
  const bc = $('bCtrl'); if (bc) bc.textContent = ctrlLabel();
  if (lastApplied && lastApplied !== inp) clearTouch();
  lastApplied = inp;
}

// ---------- orientation ----------
let portraitOK = false;
function updateOrientation() {
  const portrait = window.innerHeight > window.innerWidth;
  const needRotate = DEV.type === 'phone' && portrait && !portraitOK;
  const r = $('rotate'), was = r.classList.contains('show');
  r.classList.toggle('show', needRotate);
  if (needRotate && !was && G.state === 'play') pauseScreen();
  $('tip').classList.toggle('show', DEV.type === 'tablet' && portrait && G.state !== 'play');
  if (!portrait) portraitOK = false;
}
$('bPortrait').addEventListener('click', () => { portraitOK = true; updateOrientation(); });

// ---------- audio unlock (iOS needs a sound started inside a user gesture) ----------
let audioUnlocked = false;
function audioUnlock() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    if (!audioUnlocked) {
      const buf = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource();
      src.buffer = buf; src.connect(actx.destination); src.start(0); audioUnlocked = true;
    }
  } catch (e) { }
}

// ---------- touch controls (multi-touch: every finger is checked against every button) ----------
const TB = { left: $('tLeft'), right: $('tRight'), jump: $('tJump') };
const mouseHeld = { left: false, right: false, jump: false };
function clearTouch() { setTouch([]); for (const k in mouseHeld) mouseHeld[k] = false; }
function setTouch(points) {
  const n = { left: mouseHeld.left, right: mouseHeld.right, jump: mouseHeld.jump };
  if (inputMode() === 'touch' && G.state === 'play') {
    const rects = {}; for (const k in TB) rects[k] = TB[k].getBoundingClientRect();
    for (const pt of points) {
      let best = null, bd = Infinity;
      for (const k in rects) {
        const r = rects[k], pad = r.width * 0.25;
        if (pt.x < r.left - pad || pt.x > r.right + pad || pt.y < r.top - pad || pt.y > r.bottom + pad) continue;
        const d = Math.hypot(pt.x - (r.left + r.right) / 2, pt.y - (r.top + r.bottom) / 2);
        if (d < bd) { bd = d; best = k; }
      }
      if (best) n[best] = true;
    }
  }
  if (n.jump && !TS.jump && G.state === 'play') jumpEdge = true;
  for (const k in TS) { TS[k] = n[k]; TB[k].classList.toggle('on', n[k]); }
}
function onTouch(e) {
  if (e.type === 'touchstart' || e.type === 'touchend') audioUnlock();
  if (e.type === 'touchstart' && DEV.autoInput !== 'touch') { DEV.autoInput = 'touch'; applyMode(); }
  const playing = G.state === 'play' && inputMode() === 'touch';
  if (playing) {
    if (e.cancelable && !(e.target.closest && e.target.closest('#tPause, #tFs'))) e.preventDefault();   // no scroll / zoom / callout while playing
    setTouch([...e.touches].map(t => ({ x: t.clientX, y: t.clientY })));
  } else if (e.type === 'touchmove' && e.cancelable && !(e.target.closest && e.target.closest('.card'))) e.preventDefault();
}
['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(t => document.addEventListener(t, onTouch, { passive: false }));
// mouse / pen on the on-screen buttons (e.g. touch mode chosen manually on a PC)
for (const k in TB) {
  TB[k].addEventListener('pointerdown', e => { if (e.pointerType === 'touch') return; e.preventDefault(); mouseHeld[k] = true; setTouch([]); });
  TB[k].addEventListener('contextmenu', e => e.preventDefault());
}
window.addEventListener('pointerup', e => { if (e.pointerType === 'touch') return; for (const k in mouseHeld) mouseHeld[k] = false; setTouch([]); });
$('tPause').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (G.state === 'play') pauseScreen(); });
$('tPause').addEventListener('click', e => { e.preventDefault(); });
$('tFs').addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); toggleFullscreen(); $('tFs').blur(); });
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false })); // iOS pinch
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => { if (G.state === 'play') e.preventDefault(); });
document.addEventListener('pointerdown', () => audioUnlock(), { once: true });

// ======================================================================
//  MAIN LOOP (fixed timestep)
// ======================================================================
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= DT) { if (G.state === 'play') update(DT); else if (G.lv) G.lv.t += (G.state === 'intro' ? DT : 0); acc -= DT; }
  render();
  requestAnimationFrame(frame);
}
applyMode(); resize(); syncFsUi(); titleScreen(); requestAnimationFrame(frame);
{ const ld = document.getElementById('loading'); if (ld) ld.remove(); }
</script>
</body>
</html>
